apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output-generator
          image: imbekrishna/log-output-generator:1.10
        - name: log-output-reader
          image: imbekrishna/log-output-reader:2.1
